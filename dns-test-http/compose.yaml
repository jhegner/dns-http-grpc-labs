services:
  backend:
    image: docker.io/traefik/whoami # responde com Hostname e IP do container
    deploy:
      replicas: 3
    networks: [testnet]

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DNS_TTL: "5" # troque para -1 para ver o cache "eterno"
    depends_on: [backend]
    networks: [testnet]

networks:
  testnet:
