services:
  backend:
    image: localhost/dns-test-grpc:latest
    environment:
      MODE: server
      GRPC_PORT: "9090"
      MAX_CONNECTION_AGE_SECONDS: "${MAX_AGE:-0}"
    deploy:
      replicas: 3
    networks: [testnet]

  app:
    image: localhost/dns-test-grpc:latest
    ports:
      - "8080:8080"
    environment:
      DNS_TTL: "${DNS_TTL:-5}"
      LB_POLICY: "${LB_POLICY:-round_robin}"
      GRPC_TARGET: "dns:///backend:9090"
    depends_on: [backend]
    networks: [testnet]

networks:
  testnet: